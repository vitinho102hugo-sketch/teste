<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Publicação</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #eee3cf, #d5c8e7);
            font-family: Georgia, serif;
            color: #4b0b1a;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 45px 25px;
            background: #f7eedc;
            border: 2px solid #a68a5c;
            border-radius: 20px;
            box-shadow: 0 10px 30px #4b0b1a20;
        }

        .simbolo {
            font-size: 48px;
            color: #685080;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 15px;
        }

        p {
            font-size: 17px;
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .status {
            display: inline-block;
            padding: 10px 18px;
            background: #e1eadb;
            color: #3e6042;
            border-radius: 30px;
            font-size: 14px;
        }

        footer {
            margin-top: 30px;
            font-size: 12px;
            color: #79618f;
        }
    </style>
</head>
<body>

    <main class="container">
        <div class="simbolo">☾ ✦ ☽</div>

        <h1>Site publicado!</h1>

        <p>
            Se você está vendo esta página, a publicação do seu site
            está funcionando corretamente.
        </p>

        <span class="status">✓ Página carregada com sucesso</span>

        <footer>
            Página temporária para teste de publicação.
        </footer>
    </main>

</body>
</html>
